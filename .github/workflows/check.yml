# The mechanical half of AGENTS.md §4, run on every pull request and on main.
# The half a machine cannot check — the changed command run once in a real
# repository — stays with the author and the reviewer.
name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python3 scripts/check.py
