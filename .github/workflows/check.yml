# The mechanical half of AGENTS.md §4, run on every pull request and on main:
# the gate, then the scripts' tests. The half a machine cannot check — the
# changed command run once in a real repository — stays with the author and
# the reviewer.
name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      # Versions are raised against the first parent: on a pull request the
      # base's tip under the trial merge, on a push the previous main. The
      # whole history, so every commit of the range is there to be read for
      # agent attribution, not only the head a shallow clone keeps.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python3 scripts/check.py --base HEAD^1
      - run: python3 -m unittest discover -s tests -v
